# =============================================================================
# Commute alerts: runs transport_alerts.R on a schedule.
#   - Fridays 11:00: the outlook for next week.
#   - Weekdays 07:15-08:45 and 16:15-17:45, every 30 minutes: live checks of
#     the next 30 minutes.
#   - The 1st of each month: a "keepalive" step, since GitHub turns off
#     schedules in public repositories after 60 days without activity.
# Your stops, lines and directions are NOT in this file or the script: they're
# in the TRANSPORT_CONFIG secret. This repository is public, and so are its
# Actions logs, so the script only ever logs counts. The known-warnings file it
# saves (state/known_alerts.json) only contains keyed hashes.
# =============================================================================

name: Commute alerts

on:
  schedule:
    # Friday outlook for next week, 11:00 Oslo time. If you change this time,
    # change it in the two "if:" lines and the MODE line below too.
    - cron: "0 11 * * 5"
      timezone: "Europe/Oslo"

    # Morning live checks, Monday-Friday: 07:15, 07:45, 08:15, 08:45.
    - cron: "15,45 7,8 * * 1-5"
      timezone: "Europe/Oslo"

    # Evening live checks, Monday-Friday: 16:15, 16:45, 17:15, 17:45.
    - cron: "15,45 16,17 * * 1-5"
      timezone: "Europe/Oslo"

    # Keepalive, the 1st of each month at 12:00.
    - cron: "0 12 1 * *"
      timezone: "Europe/Oslo"

  # Adds a "Run workflow" button for testing, with a choice of check.
  workflow_dispatch:
    inputs:
      mode:
        description: "Which check to run"
        type: choice
        options: [live, outlook]
        default: live

# By default, the workflow may only read the repository.
permissions:
  contents: read

# Never run two checks at the same time (they share the known-warnings file).
concurrency:
  group: commute-alerts
  cancel-in-progress: false

jobs:
  # ---- The commute check (every schedule except the keepalive) ----
  check:
    if: github.event.schedule != '0 12 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs write access to save the known-warnings file (hashes only).
    permissions:
      contents: write
    steps:
      # Copy the repository (the R script and the known-warnings file).
      - uses: actions/checkout@v5

      # Install R, using ready-built packages for speed.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install the R packages the script needs (cached between runs).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::lubridate
            any::purrr
            any::openssl

      # Run the check. MODE is "outlook" for the Friday 11:00 schedule (or when
      # chosen with the Run workflow button), otherwise "live". The settings and
      # the Slack address come from the repository's secrets: GitHub never
      # shows them in the log, and they're not available to copies (forks) of
      # this repository.
      - name: Run commute check
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '0 11 * * 5' && 'outlook' || 'live') }}
          TRANSPORT_CONFIG: ${{ secrets.TRANSPORT_CONFIG }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: Rscript transport_alerts.R

      # Save the known-warnings file back to the repository, so the next run
      # knows which warnings you've already been told about. The file only
      # contains keyed hashes, never the warnings, stops or lines. Runs even if
      # the check failed, and only commits when the file actually changed.
      - name: Save known warnings
        if: always()
        run: |
          if [ -f state/known_alerts.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
            git add state/known_alerts.json
            if ! git diff --cached --quiet; then
              git commit -m "Update known warnings"
              git pull --rebase
              git push
            fi
          fi

  # ---- Keepalive (1st of each month) ----
  # GitHub disables scheduled workflows in public repositories after 60 days
  # without repository activity. This step re-enables (confirms) the workflow
  # through GitHub's API, which keeps it active without needing commits.
  keepalive:
    if: github.event.schedule == '0 12 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/commute-alerts.yml/enable" \
            && echo "Workflow confirmed active."
